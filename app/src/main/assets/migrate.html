<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيانات تطبيق الكيك القديم</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#331701;font-family:Tahoma,Arial,sans-serif;color:#2A1608;padding:20px;box-sizing:border-box}
.b{background:#fff;border-radius:22px;padding:26px 22px;max-width:420px;width:100%;text-align:center}h1{font-size:21px;margin:0 0 8px}p{color:#7A6656;line-height:1.8}
button{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:700;width:100%;margin-top:8px}.p{background:#FC8312;color:#fff}.g{background:#F1E6DA;color:#331701}
.ok{background:#E6F2E5;color:#2F7A3B;border-radius:12px;padding:10px;font-weight:700}.er{background:#FCE9E7;color:#C0362C;border-radius:12px;padding:10px;font-weight:700}</style></head>
<body><div class="b"><div style="font-size:48px">📦</div><h1>بيانات تطبيق الكيك القديم</h1><p id="msg">جاري البحث عن البيانات القديمة على هذا الجهاز…</p><div id="act"></div>
<button class="g" onclick="Android.retry()">رجوع للتطبيق</button></div>
<script>
/* هذي الصفحة تقرأ البيانات اللي خزنها تطبيق الكيك القديم على هذا الجهاز وتحفظها كنسخة احتياطية،
   وبعدها تسترجعها من: الإدارة ← الإعدادات ← «استيراد نسخة الكيك القديم» */
function $(i){return document.getElementById(i)}
function pad(n){return(n<10?'0':'')+n}
var S=null;try{S=JSON.parse(localStorage.getItem('sanabel')||'null')}catch(e){}
if(!S||!S.cats){$('msg').textContent='ما لكيت بيانات لتطبيق الكيك القديم على هذا الجهاز.';}
else{var n=0;S.cats.forEach(function(c){n+=(c.imgs||[]).length});
$('msg').innerHTML='لكيت: <b>'+S.cats.length+'</b> قسم، <b>'+n+'</b> تصميم، <b>'+(S.orders||[]).length+'</b> طلب.<br>اضغط «حفظ» حتى تنحفظ كنسخة احتياطية بمجلد التنزيلات / SanabelBackup، وبعدها استرجعها من التطبيق الجديد.';
$('act').innerHTML='<button class="p" id="go">💾 حفظ النسخة</button>';
$('go').onclick=function(){$('go').disabled=true;$('go').textContent='جاري التجهيز…';
var keys=(S.orders||[]).filter(function(o){return o.ph&&!o.photo}).map(function(o){return'o_'+o.id}),photos={};
var finish=function(){var d=new Date(),name='sanabel-old-cake-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
var txt=JSON.stringify({app:'sanabel',v:1,at:Date.now(),by:'التطبيق القديم',data:S,photos:photos});
try{Android.saveFile(txt,name,false);$('act').innerHTML='<div class="ok">✓ انحفظت النسخة: '+name+'</div><p>هسه ارجع للتطبيق، وروح: الإدارة ← الإعدادات ← «استيراد نسخة الكيك القديم» واختار هذا الملف.</p>'}
catch(e){$('act').innerHTML='<div class="er">ما گدر يحفظ: '+e.message+'</div>'}};
try{var r=indexedDB.open('sanabel',1);r.onupgradeneeded=function(){r.result.createObjectStore('ph')};
r.onsuccess=function(){var db=r.result,left=keys.length;if(!left)return finish();
keys.forEach(function(k){try{var q=db.transaction('ph').objectStore('ph').get(k);q.onsuccess=function(){if(q.result)photos[k]=q.result;if(!--left)finish()};q.onerror=function(){if(!--left)finish()}}catch(e){if(!--left)finish()}})};
r.onerror=finish}catch(e){finish()}}}
</script></body></html>

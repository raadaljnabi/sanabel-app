plugins {
    id 'com.android.application'
}
// إشعارات وهو مسدود: تشتغل من تحط ملف google-services.json (من Firebase) بمجلد app
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }

def runNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.cakeshow.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cakeshow.app'
        minSdk 21
        targetSdk 34
        versionCode runNum
        versionName "1.${runNum}"
    }

    // Fixed signing key so every new version installs as an update over the old one without losing data
    signingConfigs {
        fixed {
            storeFile file('cake.keystore')
            storePassword 'cake1234'
            keyAlias 'cake'
            keyPassword 'cake1234'
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
